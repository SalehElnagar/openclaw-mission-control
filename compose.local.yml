services:
  db:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  backend:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

  frontend:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"

  webhook-worker:
    restart: unless-stopped
